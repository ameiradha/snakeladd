<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Cheerful Bright Background Gradient -->
    <linearGradient id="brightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <!-- Vibrant Snake Green Gradient -->
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Snake Belly Yellow Gradient -->
    <linearGradient id="snakeBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Golden Ladder Gradient -->
    <linearGradient id="ladderGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="shadowDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Base App Card with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#brightBg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4" />

  <!-- Subtle Checkerboard Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="3">
    <rect x="76" y="76" width="90" height="90" rx="16" fill="#3b82f6" fill-opacity="0.2"/>
    <rect x="166" y="76" width="90" height="90" rx="16" fill="#10b981" fill-opacity="0.2"/>
    <rect x="256" y="76" width="90" height="90" rx="16" fill="#f59e0b" fill-opacity="0.2"/>
    <rect x="346" y="76" width="90" height="90" rx="16" fill="#ec4899" fill-opacity="0.2"/>
    <rect x="76" y="166" width="90" height="90" rx="16"/>
    <rect x="346" y="166" width="90" height="90" rx="16"/>
    <rect x="76" y="256" width="90" height="90" rx="16"/>
    <rect x="346" y="256" width="90" height="90" rx="16"/>
  </g>

  <!-- Wooden Climbing Ladder behind the snake -->
  <g stroke="url(#ladderGold)" stroke-width="14" stroke-linecap="round" opacity="0.9" filter="url(#shadowDrop)">
    <line x1="120" y1="430" x2="220" y2="100" />
    <line x1="175" y1="445" x2="275" y2="115" />
    <!-- Rungs -->
    <line x1="130" y1="395" x2="185" y2="410" stroke-width="11" />
    <line x1="150" y1="330" x2="205" y2="345" stroke-width="11" />
    <line x1="170" y1="265" x2="225" y2="280" stroke-width="11" />
    <line x1="190" y1="200" x2="245" y2="215" stroke-width="11" />
    <line x1="210" y1="135" x2="265" y2="150" stroke-width="11" />
  </g>

  <!-- Main Friendly Green Snake Character (Prominent & Clear) -->
  <g filter="url(#shadowDrop)">
    <!-- Snake Tail to Coiled Body -->
    <path d="M 230 420 C 180 435, 140 370, 200 320 C 270 270, 360 380, 410 320 C 460 260, 440 180, 350 170 C 290 160, 280 230, 340 230"
          fill="none" stroke="url(#snakeBody)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Yellow Belly Accent Stripe -->
    <path d="M 230 420 C 180 435, 140 370, 200 320 C 270 270, 360 380, 410 320 C 460 260, 440 180, 350 170"
          fill="none" stroke="url(#snakeBelly)" stroke-width="16" stroke-linecap="round" opacity="0.85" />

    <!-- Snake Head (Cute Rounded Oval) -->
    <ellipse cx="360" cy="150" rx="55" ry="48" fill="url(#snakeBody)" />

    <!-- Rosy Cheeks -->
    <circle cx="340" cy="175" r="10" fill="#f43f5e" opacity="0.4" />
    <circle cx="395" cy="170" r="10" fill="#f43f5e" opacity="0.4" />

    <!-- Big Cute Cartoon Eyes -->
    <!-- Left Eye -->
    <ellipse cx="335" cy="135" rx="18" ry="22" fill="#ffffff" />
    <circle cx="340" cy="135" r="10" fill="#0f172a" />
    <circle cx="336" cy="129" r="4" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="380" cy="130" rx="18" ry="22" fill="#ffffff" />
    <circle cx="385" cy="130" r="10" fill="#0f172a" />
    <circle cx="381" cy="124" r="4" fill="#ffffff" />

    <!-- Cute Smiling Mouth -->
    <path d="M 345 170 Q 365 188 385 168" fill="none" stroke="#064e3b" stroke-width="5" stroke-linecap="round" />

    <!-- Playful Forked Tongue sticking out -->
    <path d="M 368 180 L 372 205 L 360 218 M 372 205 L 384 218" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />

    <!-- Tiny Royal Crown on Snake's head -->
    <path d="M 340 108 L 350 86 L 362 98 L 374 86 L 384 108 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3" />
    <circle cx="350" cy="84" r="3" fill="#ef4444" />
    <circle cx="362" cy="96" r="3" fill="#3b82f6" />
    <circle cx="374" cy="84" r="3" fill="#10b981" />
  </g>

  <!-- Playful Quiz Star Accents -->
  <path d="M 100 110 Q 100 128 85 128 Q 100 128 100 146 Q 100 128 115 128 Q 100 128 100 110" fill="#f59e0b" />
  <path d="M 430 90 Q 430 105 418 105 Q 430 105 430 120 Q 430 105 442 105 Q 430 105 430 90" fill="#10b981" />
</svg>
